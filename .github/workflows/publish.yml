name: Чёткий Ярославль — новости ВК

on:
  push:
    branches: [main]
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chetkiy-yaroslavl-vk-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bot locally
        run: python -m unittest -v test_bot.py
      - name: Find and prepare Yaroslavl news
        env:
          YAROSLAVL_VK_TOKEN: ${{ secrets.YAROSLAVL_VK_TOKEN }}
          YAROSLAVL_OPENAI_KEY: ${{ secrets.YAROSLAVL_OPENAI_KEY }}
          YAROSLAVL_OPENAI_MODEL: gpt-4o-mini
          DRY_RUN: "true"
        run: python main.py
      - name: Save publication history
        if: success()
        run: |
          if [[ -n "$(git status --porcelain history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json
            git commit -m "Update published Yaroslavl news history"
            git pull --rebase
            git push
          fi
